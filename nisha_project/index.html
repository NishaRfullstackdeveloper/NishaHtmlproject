<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        header {
            background: #333;
            color: white;
            padding: 1rem 0;
            text-align: center;
        }

        header h1 {
            color: #ff6600;
        }

        nav {
            display: flex;
            justify-content: center;
            background: #444;
            padding: 1rem 0;
        }

        nav a {
            color: white;
            margin: 0 1rem;
            text-decoration: none;
            font-size: 1.1rem;
        }

        nav a:hover {
            color: #ff6600;
        }

        .hero {
            text-align: center;
            padding: 4rem 1rem;
            background: #f5f5f5;
        }

        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .hero span {
            color: #ff6600;
        }

        .hero p {
            margin: 1rem auto;
            max-width: 600px;
            font-size: 1rem;
        }

        .buttons {
            margin-top: 2rem;
        }

        .buttons a {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            margin: 0.5rem;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .buttons .hire {
            background: black;
            color: white;
        }

        .buttons .experience {
            background: #ff6600;
            color: white;
        }

        .profile-img {
    margin: 2rem auto;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: url('nisha.jpg') no-repeat center center/cover;
}


        footer {
            text-align: center;
            background: #333;
            color: white;
            padding: 1rem;
            margin-top: 2rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                text-align: center;
            }

            .hero h2 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 0.9rem;
            }

            .buttons a {
                padding: 0.5rem 1rem;
            }

            .profile-img {
                width: 150px;
                height: 150px;
            }
        }

        @media (max-width: 480px) {
            .hero h2 {
                font-size: 1.5rem;
            }

            .hero p {
                font-size: 0.8rem;
            }
        }


    </style>
</head>
<body>
