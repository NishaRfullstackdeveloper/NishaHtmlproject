<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Projects</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .header {
            background-color: blue;
            color: white;
            width: 100%;
            text-align: center;
            padding: 20px 0;
        }

        .content {
            width: 90%;
            max-width: 1200px;
            color: white;
            background-color: black;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5vh;
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 5vh;
            flex-wrap: wrap;
            width: 100%;
        }

        .project {
            border: 2px solid black;
            border-style: groove;
            width: 30%;
            background: white;
            padding: 10px;
            height: 50vh;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .project h2 {
            color: black;
            font-size: 1.2rem;
            text-align: center;
        }

        .project img {
            width: 100%;
            height: auto;
            filter: grayscale(50%);
            box-shadow: 5px 5px 10px rgba(39, 25, 91, 0.7);
            border-radius: 5px;
        }

        .project img:hover {
            filter: grayscale(0%);
        }

        .project a {
            text-decoration: none;
            font-weight: bold;
            color: blue;
        }

        .project a:hover {
            color: darkblue;
        }

        .project:hover {
            transform: translateY(-5px);
        }

        @media (max-width: 1024px) {
            .project {
                width: 45%;
            }
        }

        @media (max-width: 768px) {
            .project {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="header">
            <h1>MY HTML PROJECTS</h1>
        </div>
        <div class="content">
            <div class="row">
                <div class="project">
                    <h2>RESUME PROJECT</h2>
                    <img src="https://fiverr-res.cloudinary.com/images/q_auto,f_auto/gigs2/317989932/original/87a8bf67c77a0b7b0ecb2b29b9f3efab6e9ab114/design-the-perfect-resume-for-you.jpg" alt="Screenshot of Resume Project">
                    <h3><a href="./myressumee.html" target="_blank">MY RESUME</a></h3>
                </div>
                <div class="project">
                    <h2>FORM PROJECT</h2>
                    <img src="https://www.perkins.org/wp-content/uploads/2022/08/Microsoft-Form.jpg" alt="Screenshot of Form Project">
                    <h3><a href="./form1.html" target="_blank">FORM PROJECT ONE</a></h3>
                </div>
                <div class="project">
                    <h2>TABLE PROJECT</h2>
                    <img src="https://lirp.cdn-website.com/1984fff8/dms3rep/multi/opt/10+ways+to+create+beautiful+tables+on+websites+530x384-1920w.jpg" alt="Screenshot of Table Project">
                    <h3><a href="./myt.html" target="_blank">YOUTUBE PAGE USING TABLE</a></h3>
                </div>
            </div>
            <div class="row">
                <div class="project">
                    <h2>RESULT SHEET USING TABLE</h2>
                    <img src="https://www.freecodecamp.org/news/content/images/2021/09/uide-to-writting-a-good-readme-file--7-.png" alt="Screenshot of Result Sheet Table">
                    <h3><a href="./resultsheettable.html" target="_blank">RESULT SHEET TABLE</a></h3>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
